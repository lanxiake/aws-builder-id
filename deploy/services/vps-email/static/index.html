<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEMPMAIL · 临时邮箱</title>
  <style>
    :root {
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --bg-grad-a: #6ee7ff;
      --bg-grad-b: #fbc2eb;
      --card: #ffffff;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-grad-a) 0%, #d8d4ff 45%, var(--bg-grad-b) 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 28px; }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0 14px;
    }
    .logo { font-weight: 800; color: #ef6c00; letter-spacing: .3px; }
    .nav { font-size: 13px; color: var(--muted); display: flex; gap: 14px; }
    .hero-title {
      text-align: center; font-size: 42px; font-weight: 900; margin: 8px 0 14px;
      background: linear-gradient(90deg, #6a11cb, #2575fc, #d946ef);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tabs {
      display: flex; justify-content: center; margin-bottom: 14px;
    }
    .tabs-inner {
      display: inline-flex; gap: 8px; background: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 4px;
      box-shadow: 0 8px 20px rgba(31,41,55,.08);
    }
    .tab {
      border: none; background: transparent; color: #4b5563; border-radius: 999px;
      padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    .tab.active { background: #ffffff; color: #111827; font-weight: 700; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .address-card {
      max-width: 720px; margin: 0 auto 16px; background: #fff;
      border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 28px rgba(17,24,39,.10);
      padding: 12px 14px;
    }
    .address-line { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 8px; }
    .icon-btn {
      border: none; background: #f3f4f6; width: 34px; height: 34px; border-radius: 10px;
      cursor: pointer; color: #4b5563;
    }
    .addr {
      text-align: center; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status { margin: 8px 2px 0; font-size: 12px; color: var(--muted); min-height: 18px; }
    .panel {
      margin: 0 auto; max-width: 860px; background: #fff; border-radius: 16px;
      border: 1px solid var(--line); box-shadow: 0 12px 28px rgba(17,24,39,.10);
      overflow: hidden;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 800;
    }
    .btn { border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
    .btn-dark { background: #111827; color: #fff; }
    .btn-main { background: var(--primary); color: #fff; }
    .btn-gray { background: #f3f4f6; color: #111827; }
    .ops { padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fafafa; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
    .g-12 { grid-column: span 12; }
    .g-6 { grid-column: span 6; }
    .g-4 { grid-column: span 4; }
    @media (max-width: 860px) { .g-6, .g-4 { grid-column: span 12; } .hero-title { font-size: 32px; } }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input, select {
      width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 9px 10px;
      background: #fff; font: inherit; color: #111827;
    }
    .row-btn { display: flex; gap: 8px; flex-wrap: wrap; }
    .codebox {
      margin-top: 10px; border: 1px solid #fde68a; background: #fffbeb; border-radius: 12px; padding: 10px 12px;
      display: none;
    }
    .codebox .code { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #b45309; }
    .codebox .tip { font-size: 12px; color: #92400e; margin-top: 3px; }
    .mails { padding: 8px 16px 16px; }
    .empty { color: var(--muted); text-align: center; padding: 36px 0; }
    .mail { border-top: 1px solid var(--line); padding: 12px 0; }
    .mail:first-child { border-top: none; }
    .mail h3 { margin: 0 0 6px; font-size: 15px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    pre {
      margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto;
      background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; font-size: 12px;
    }
    .codes { margin: 8px 0 10px; display:flex; flex-wrap:wrap; gap:8px; }
    .code-chip {
      border: 1px solid #f59e0b; background: #fff7ed; color: #9a3412; border-radius: 999px;
      padding: 4px 10px; font-size: 12px; font-weight: 700; display:inline-flex; align-items:center; gap:8px;
    }
    .code-chip button {
      border: none; background: #f59e0b; color: #fff; border-radius: 999px; padding: 2px 7px; cursor: pointer; font-size: 11px;
    }
    .jwt-box { margin-top: 10px; border: 1px dashed #d1d5db; border-radius: 10px; padding: 10px; background: #fff; }
    .jwt-value {
      font-size: 12px; color: #374151; word-break: break-all; max-height: 74px; overflow: auto; background:#f8fafc; border:1px solid #e5e7eb; border-radius:8px; padding:8px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo">✉ TEMPMAIL</div>
      <div class="nav"><span>简体中文</span><span>首页</span><span>博客</span><span>登录</span></div>
    </div>

    <h1 class="hero-title">您的临时邮箱地址</h1>

    <div class="tabs">
      <div class="tabs-inner">
        <button class="tab active" type="button" id="tabTemp">临时邮箱</button>
        <button class="tab" type="button" id="tabGmail">Gmail 别名</button>
      </div>
    </div>

    <div class="address-card">
      <div class="address-line">
        <button class="icon-btn" type="button" id="btnQuickRefresh" title="刷新">↻</button>
        <div id="currentAddr" class="addr">请先创建或切换邮箱</div>
        <button class="icon-btn" type="button" id="btnCopyAddr" title="复制">⧉</button>
      </div>
      <div class="status" id="status">准备就绪</div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <span>收件箱</span>
        <button class="btn btn-dark" type="button" id="btnRefresh">刷新</button>
      </div>

      <div class="ops tab-pane active" id="paneTemp">
        <div class="grid">
          <div class="g-6">
            <label for="prefix">新建邮箱前缀（仅字母数字，留空随机）</label>
            <input id="prefix" placeholder="例如 test001" />
          </div>
          <div class="g-6">
            <label for="mailboxSelect">历史邮箱（用于后续登录收验证码）</label>
            <select id="mailboxSelect"></select>
          </div>

          <div class="g-6">
            <label for="jwtImport">导入历史 JWT（换设备恢复邮箱）</label>
            <input id="jwtImport" placeholder="粘贴历史 JWT" />
          </div>
          <div class="g-6">
            <label for="manualAddress">手动输入历史邮箱（可选）</label>
            <input id="manualAddress" placeholder="例如 your_old@metoolbot.top（可不填）" />
          </div>
          <div class="g-6">
            <label>操作</label>
            <div class="row-btn">
              <button class="btn btn-main" type="button" id="btnCreate">创建</button>
              <button class="btn btn-gray" type="button" id="btnUseSelected">切换历史</button>
              <button class="btn btn-gray" type="button" id="btnImportJwt">导入/添加历史</button>
              <button class="btn btn-gray" type="button" id="btnRemoveSelected">删除历史</button>
              <button class="btn btn-gray" type="button" id="btnAuto">自动刷新: 关</button>
            </div>
          </div>
        </div>

        <div class="codebox" id="codeBox">
          <div>最新验证码</div>
          <div class="code" id="latestCode">-</div>
          <div class="tip" id="codeSource">暂无</div>
          <div class="row-btn" style="margin-top:8px;">
            <button class="btn btn-gray" type="button" id="btnCopyLatestCode">复制最新验证码</button>
          </div>
        </div>

        <div class="jwt-box">
          <label>当前 JWT（便于导出/恢复）</label>
          <div class="jwt-value mono" id="jwtPreview">(暂无)</div>
          <div class="row-btn" style="margin-top:8px;">
            <button class="btn btn-gray" type="button" id="btnCopyJwt">复制 JWT</button>
            <button class="btn btn-gray" type="button" id="btnExportJwt">导出 JWT</button>
          </div>
        </div>
      </div>

      <div class="ops tab-pane" id="paneGmail">
        <div class="grid">
          <div class="g-12">
            <label>Gmail 别名模式说明</label>
            <div style="font-size:13px; color:#374151; line-height:1.7;">
              Gmail 别名模式用于展示/复制你当前别名地址（例如 <span class="mono">base+tag@gmail.com</span>），
              实际邮件查看与验证码提取仍走下面收件箱区域或自动化脚本。此 Tab 现在支持点击切换，不会再失效。
            </div>
          </div>
          <div class="g-6">
            <label for="gmailAliasAddress">当前 Gmail 别名地址</label>
            <input id="gmailAliasAddress" placeholder="例如 toojia0510+abc123@gmail.com" />
          </div>
          <div class="g-6">
            <label>快速操作</label>
            <div class="row-btn">
              <button class="btn btn-main" type="button" id="btnUseGmailAlias">设为当前展示地址</button>
              <button class="btn btn-gray" type="button" id="btnCopyGmailAlias">复制别名地址</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mails" id="inbox">
        <p class="empty">收件箱为空，等待接收邮件...</p>
      </div>
    </section>

    <input type="hidden" id="jwt" />
    <input type="hidden" id="domainBadge" value="metoolbot.top" />
  </div>

  <script>
    const LS_KEY = "tempmail_jwt";
    const LS_HISTORY_KEY = "tempmail_history_v2";
    let autoTimer = null;
    let currentMode = "temp";
    let currentGmailAlias = "";
    let currentGmailRouteAlias = "";
    let currentPrefix = "";

    async function api(path, opts = {}) {
      const jwt = document.getElementById("jwt").value || localStorage.getItem(LS_KEY);
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (jwt) headers["Authorization"] = "Bearer " + jwt;
      const r = await fetch(path, { ...opts, headers });
      if (!r.ok) throw new Error(await r.text() || r.statusText);
      const ct = r.headers.get("content-type") || "";
      return ct.includes("json") ? r.json() : r.text();
    }

    function setStatus(msg, ok = true) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.style.color = ok ? "#6b7280" : "#dc2626";
    }

    async function copyText(text, successMsg, failMsg) {
      if (!text) {
        setStatus("无可复制内容", false);
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        setStatus(successMsg || "已复制");
      } catch {
        setStatus(failMsg || "复制失败，请手动复制", false);
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const isTemp = mode === "temp";
      document.getElementById("tabTemp").classList.toggle("active", isTemp);
      document.getElementById("tabGmail").classList.toggle("active", !isTemp);
      document.getElementById("paneTemp").classList.toggle("active", isTemp);
      document.getElementById("paneGmail").classList.toggle("active", !isTemp);
      updateAddressDisplay();
      setStatus(isTemp ? "临时邮箱模式" : "Gmail 别名模式");
      refreshInbox();
    }

    function loadHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LS_HISTORY_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory(items) {
      localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(items.slice(0, 50)));
    }

    function renderHistorySelect(selectedJwt = "") {
      const sel = document.getElementById("mailboxSelect");
      const items = loadHistory();
      if (!items.length) {
        sel.innerHTML = '<option value="">(无历史邮箱)</option>';
        return;
      }
      sel.innerHTML = items
        .map((it) => `<option value="${it.jwt}" ${it.jwt === selectedJwt ? "selected" : ""}>${it.address}${it.gmail_alias ? ` | ${it.gmail_alias}` : ""}</option>`)
        .join("");
    }

    function upsertHistory(address, jwt, gmailAlias = "", prefix = "") {
      const items = loadHistory().filter((x) => x.jwt !== jwt && x.address !== address);
      items.unshift({ address, jwt, gmail_alias: gmailAlias, prefix, updatedAt: Date.now() });
      saveHistory(items);
      renderHistorySelect(jwt);
    }

    function findHistoryByJwt(jwt) {
      return loadHistory().find((x) => x.jwt === jwt) || null;
    }

    async function loadAddressFromJwt(jwt) {
      const data = await api("/api/me", { headers: { Authorization: "Bearer " + jwt } });
      return data;
    }

    function updateAddressDisplay() {
      const addrEl = document.getElementById("currentAddr");
      if (currentMode === "gmail") {
        addrEl.textContent = currentGmailAlias || "请先创建或切换邮箱";
      } else {
        const hist = findHistoryByJwt(document.getElementById("jwt").value || localStorage.getItem(LS_KEY) || "");
        addrEl.textContent = (hist && hist.address) || "请先创建或切换邮箱";
      }
    }

    function setCurrentMailbox(address, jwt, gmailAlias = "", prefix = "", gmailRouteAlias = "") {
      document.getElementById("jwt").value = jwt;
      localStorage.setItem(LS_KEY, jwt);
      currentGmailAlias = gmailAlias || "";
      currentGmailRouteAlias = gmailRouteAlias || "";
      currentPrefix = prefix || "";
      document.getElementById("jwtPreview").textContent = jwt || "(暂无)";
      document.getElementById("gmailAliasAddress").value = currentGmailAlias || "";
      upsertHistory(address, jwt, currentGmailAlias, currentPrefix);
      updateAddressDisplay();
    }

    async function createAddress() {
      const name = document.getElementById("prefix").value.trim();
      setStatus("正在创建邮箱...");
      try {
        const data = await api("/api/new_address", {
          method: "POST",
          body: JSON.stringify({ name }),
        });
        setCurrentMailbox(
          data.address,
          data.jwt,
          data.gmail_alias || "",
          data.prefix || "",
          data.gmail_route_alias || ""
        );
        setStatus("邮箱已创建，临时邮箱与 Gmail 别名前缀已同步");
        await refreshInbox();
      } catch (e) {
        setStatus("创建失败: " + e.message, false);
      }
    }

    function extractCode(text) {
      const all = (text || "").match(/\b\d{6}\b/g) || [];
      const bad = new Set(["000000", "111111", "123456", "555555", "999999"]);
      for (let i = all.length - 1; i >= 0; i--) {
        if (!bad.has(all[i])) return all[i];
      }
      return all[all.length - 1] || "";
    }

    function extractCodes(text) {
      const all = (text || "").match(/\b\d{6}\b/g) || [];
      const bad = new Set(["000000", "111111", "123456", "555555", "999999"]);
      const uniq = [];
      for (const c of all) {
        if (!bad.has(c) && !uniq.includes(c)) uniq.push(c);
      }
      return uniq;
    }

    function showLatestCode(mails) {
      const box = document.getElementById("codeBox");
      const codeEl = document.getElementById("latestCode");
      const srcEl = document.getElementById("codeSource");
      let found = "";
      let source = "";
      for (const m of mails || []) {
        const merged = `${m.subject || ""}\n${m.raw || ""}`;
        const c = extractCode(merged);
        if (c) {
          found = c;
          source = `${m.subject || "(无主题)"} / ${(m.from || m.source || "").toString()} / ${m.channel || "temp"}`;
          break;
        }
      }
      if (found) {
        box.style.display = "block";
        codeEl.textContent = found;
        srcEl.textContent = source;
      } else {
        box.style.display = "none";
      }
    }

    async function refreshInbox() {
      const jwt = document.getElementById("jwt").value || localStorage.getItem(LS_KEY);
      if (!jwt) {
        setStatus("请先创建邮箱或切换历史邮箱", false);
        return;
      }
      setStatus("正在刷新邮件...");
      try {
        const channel = currentMode === "gmail" ? "gmail" : "temp";
        const mails = await api(`/api/mails?limit=40&channel=${channel}`);
        renderInbox(mails);
        showLatestCode(mails);
        setStatus(`已更新 · ${new Date().toLocaleTimeString()} · ${currentMode === "gmail" ? "Gmail 别名" : "临时邮箱"}`);
      } catch (e) {
        setStatus("加载失败: " + e.message, false);
        document.getElementById("inbox").innerHTML = '<p class="empty">加载失败</p>';
      }
    }

    function renderInbox(mails) {
      const box = document.getElementById("inbox");
      if (!mails || !mails.length) {
        box.innerHTML = '<p class="empty">收件箱为空，等待接收邮件...</p>';
        return;
      }
      box.innerHTML = mails.map((m) => {
        const subj = (m.subject || "(无主题)").replace(/</g, "&lt;");
        const from = (m.from || m.source || "").replace(/</g, "&lt;");
        const channel = (m.channel || "temp") === "gmail_alias" ? "Gmail 别名" : "临时邮箱";
        const raw = m.raw || "";
        const escaped = raw.replace(/</g, "&lt;");
        const merged = `${m.subject || ""}\n${raw}`;
        const codes = extractCodes(merged);
        const codeHtml = codes.length
          ? `<div class="codes">${codes.map((c) => `<span class="code-chip">${c}<button type="button" data-code="${c}" class="btn-copy-code">复制</button></span>`).join("")}</div>`
          : "";
        const looksHtml = /<\/?[a-z][\s\S]*>/i.test(raw);
        const rendered = looksHtml
          ? `<iframe style="width:100%;height:260px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;" sandbox="" srcdoc="${raw.replace(/"/g, "&quot;")}"></iframe>`
          : `<pre>${escaped}</pre>`;
        return `<article class="mail"><h3>${subj}</h3><div class="meta">发件人: ${from} · 通道: ${channel}</div>${codeHtml}${rendered}</article>`;
      }).join("");

      box.querySelectorAll(".btn-copy-code").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-code") || "";
          copyText(code, `验证码 ${code} 已复制`);
        });
      });
    }

    function toggleAuto() {
      const btn = document.getElementById("btnAuto");
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        btn.textContent = "自动刷新: 关";
        return;
      }
      autoTimer = setInterval(refreshInbox, 5000);
      btn.textContent = "自动刷新: 开";
      refreshInbox();
    }

    async function useSelectedMailbox() {
      const jwt = document.getElementById("mailboxSelect").value;
      if (!jwt) return;
      try {
        const info = await loadAddressFromJwt(jwt);
        const address = info.address || "";
        const gmailAlias = info.gmail_alias || "";
        const gmailRouteAlias = info.gmail_route_alias || "";
        const hist = findHistoryByJwt(jwt);
        setCurrentMailbox(
          address,
          jwt,
          gmailAlias || (hist && hist.gmail_alias) || "",
          (hist && hist.prefix) || "",
          gmailRouteAlias || ""
        );
        setStatus("已切换到历史邮箱");
        await refreshInbox();
      } catch (e) {
        setStatus("切换失败: " + e.message, false);
      }
    }

    function removeSelectedMailbox() {
      const jwt = document.getElementById("mailboxSelect").value;
      if (!jwt) return;
      const items = loadHistory().filter((x) => x.jwt !== jwt);
      saveHistory(items);
      renderHistorySelect();
      setStatus("已删除历史邮箱记录");
    }

    async function importJwt() {
      const jwt = document.getElementById("jwtImport").value.trim();
      if (!jwt) {
        setStatus("请先粘贴 JWT", false);
        return;
      }
      try {
        const info = await loadAddressFromJwt(jwt);
        const resolved = info.address || "";
        const gmailAlias = info.gmail_alias || "";
        const gmailRouteAlias = info.gmail_route_alias || "";
        const address = document.getElementById("manualAddress").value.trim() || resolved;
        setCurrentMailbox(address, jwt, gmailAlias, "", gmailRouteAlias);
        document.getElementById("jwtImport").value = "";
        document.getElementById("manualAddress").value = "";
        setStatus("JWT 导入成功，已恢复历史邮箱");
        await refreshInbox();
      } catch {
        setStatus("导入失败，JWT 无效或已过期", false);
      }
    }

    async function copyCurrentJwt() {
      const jwt = document.getElementById("jwt").value || localStorage.getItem(LS_KEY) || "";
      if (!jwt) {
        setStatus("当前无 JWT 可复制", false);
        return;
      }
      await copyText(jwt, "JWT 已复制");
    }

    function exportCurrentJwt() {
      const jwt = document.getElementById("jwt").value || localStorage.getItem(LS_KEY) || "";
      const addr = document.getElementById("currentAddr").textContent || "";
      if (!jwt) {
        setStatus("当前无 JWT 可导出", false);
        return;
      }
      const payload = {
        address: addr,
        gmail_alias: currentGmailAlias || "",
        gmail_route_alias: currentGmailRouteAlias || "",
        prefix: currentPrefix || "",
        jwt,
        exported_at: new Date().toISOString(),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tempmail-jwt-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("JWT 导出成功");
    }

    async function useGmailAliasAddress() {
      const alias = document.getElementById("gmailAliasAddress").value.trim();
      if (!alias) {
        setStatus("请先输入 Gmail 别名地址", false);
        return;
      }
      currentGmailAlias = alias;
      updateAddressDisplay();
      setStatus("已设置 Gmail 别名展示地址");
      await refreshInbox();
    }

    async function copyAddress() {
      const addr = document.getElementById("currentAddr").textContent || "";
      if (!addr || addr.includes("请先")) {
        setStatus("当前无地址可复制", false);
        return;
      }
      await copyText(addr, "邮箱地址已复制");
    }

    document.getElementById("btnCreate").onclick = createAddress;
    document.getElementById("btnRefresh").onclick = () => createAddress();
    document.getElementById("btnQuickRefresh").onclick = () => createAddress();
    document.getElementById("btnAuto").onclick = toggleAuto;
    document.getElementById("btnUseSelected").onclick = useSelectedMailbox;
    document.getElementById("btnRemoveSelected").onclick = removeSelectedMailbox;
    document.getElementById("btnImportJwt").onclick = importJwt;
    document.getElementById("btnCopyAddr").onclick = copyAddress;
    document.getElementById("btnCopyJwt").onclick = copyCurrentJwt;
    document.getElementById("btnExportJwt").onclick = exportCurrentJwt;
    document.getElementById("btnCopyLatestCode").onclick = () => copyText(document.getElementById("latestCode").textContent || "", "最新验证码已复制");
    document.getElementById("tabTemp").onclick = () => switchMode("temp");
    document.getElementById("tabGmail").onclick = () => switchMode("gmail");
    document.getElementById("btnUseGmailAlias").onclick = useGmailAliasAddress;
    document.getElementById("btnCopyGmailAlias").onclick = () => copyText(document.getElementById("gmailAliasAddress").value.trim(), "Gmail 别名已复制");

    (async function init() {
      const saved = localStorage.getItem(LS_KEY);
      renderHistorySelect(saved || "");
      if (saved) document.getElementById("jwt").value = saved;
      document.getElementById("jwtPreview").textContent = saved || "(暂无)";
      await loadHealth();
      if (saved) {
        await useSelectedMailbox().catch(() => refreshInbox());
      }
      switchMode("temp");
    })();
  </script>
</body>
</html>
