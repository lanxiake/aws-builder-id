email:
  # provider: vps | gmail_alias
  #   vps        = VPS 自建邮箱 API（metoolbot.top）
  #   gmail_alias = Gmail 点号/+tag 别名（需配 gmail 节）
  provider: gmail_alias

  # --- VPS 自建邮箱配置 ---
  worker_url: https://mx1.metoolbot.top
  domain: metoolbot.top
  prefix_length: 10
  wait_timeout: 180
  poll_interval: 5
  admin_password: CHANGE_ME_STRONG_PASSWORD

  # --- Gmail 别名配置 ---
  gmail:
    base_user: toojia0510
    # App Password（16 位，空格分隔）。建议改用环境变量 GMAIL_APP_PASSWORD
    app_password: "ties zgem pvky ilah"
    # 别名 tag 长度（仅小写字母+数字，格式: baseuser+{tag}@gmail.com）
    tag_length: 12

# 注册流程
registration:
  # 注册成功后自动执行登录验证
  verify_login_after_register: true
browser:
  # engine: uc | cloak  （cloak 使用 CloakBrowser 修补 Chromium + UC，抗风控更强）
  engine: cloak
  headless: false
  slow_mo: 80
region:
  current: germany
  device_type: desktop
  use_proxy: false
  proxy_mode: static
  proxy_url: ''
  proxy_api:
    url: ''
    timeout: 10
    protocol: http
    auth_required: false
    username: ''
    password: ''
  profiles:
    germany:
      locale: de-DE
      timezone: Europe/Berlin
      accept_language: de-DE,de;q=0.9,en;q=0.8
      desktop_user_agents:
      - Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0
        Safari/537.36
      mobile_user_agents:
      - Mozilla/5.0 (Linux; Android 14; SM-S918B) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/120.0.0.0 Mobile Safari/537.36
    japan:
      locale: ja-JP
      timezone: Asia/Tokyo
      accept_language: ja-JP,ja;q=0.9,en;q=0.8
      desktop_user_agents:
      - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/120.0.0.0 Safari/537.36
      mobile_user_agents:
      - Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X) AppleWebKit/605.1.15
        (KHTML, like Gecko) Version/17.2 Mobile/15E148 Safari/604.1
    usa:
      locale: en-US
      timezone: America/New_York
      accept_language: en-US,en;q=0.9
      desktop_user_agents:
      - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
        Gecko) Chrome/120.0.0.0 Safari/537.36
      mobile_user_agents:
      - Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X) AppleWebKit/605.1.15
        (KHTML, like Gecko) Version/17.2 Mobile/15E148 Safari/604.1
http:
  timeout: 30
